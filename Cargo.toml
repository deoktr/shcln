[package]
name = "shcln"
version = "0.6.4"
edition = "2021"
authors = ["deoktr"]
license = "GPLv3"
description = "Shell history cleaner tool"
readme = "README.md"
homepage = "https://github.com/deoktr/shcln"
repository = "https://github.com/deoktr/shcln"
keywords = ["security", "cli"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
regex = "1.12.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
